<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Timetable — Penjana Jadual Waktu Guru</title>
<meta name="description" content="Digital Timetable: jana jadual waktu guru, kelas dan bilik secara automatik.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230b1220'/%3E%3Crect x='96' y='96' width='140' height='140' rx='24' fill='%23f59e0b'/%3E%3Crect x='276' y='96' width='140' height='140' rx='24' fill='%2322d3ee'/%3E%3Crect x='96' y='276' width='140' height='140' rx='24' fill='%2334d399'/%3E%3Crect x='276' y='276' width='140' height='140' rx='24' fill='%23f472b6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220;--panel:#111a2e;--panel2:#16213a;--line:#24324f;--text:#e6ecf7;--muted:#8b9bbb;
  --amber:#f59e0b;--cyan:#22d3ee;--green:#34d399;--pink:#f472b6;--red:#f87171;
  --radius:14px;--shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:Sora,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--cyan)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0e1730,#0b1220);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:34px;height:34px}
.logo i{border-radius:4px}.logo i:nth-child(1){background:var(--amber)}.logo i:nth-child(2){background:var(--cyan)}.logo i:nth-child(3){background:var(--green)}.logo i:nth-child(4){background:var(--pink)}
.brand b{font-family:Sora;font-size:17px;line-height:1.1}.brand small{color:var(--muted);font-size:11px;display:block}
.nav{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);display:flex;gap:10px;align-items:center;font-weight:600}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--amber)}
.nav .n{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--line)}
.nav.on .n{background:var(--amber);color:#111}
aside .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px}
main{padding:28px 32px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h2{font-size:26px}.head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--cyan)}
input[type=color]{padding:2px;height:38px;width:52px}
input[type=checkbox]{width:auto}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#111}
.btn.pri:hover{filter:brightness(1.1)}
.btn.big{padding:14px 24px;font-size:16px}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px}
table.list{width:100%;border-collapse:collapse}
table.list th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
table.list td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:hover td{background:var(--panel2)}
.dot{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:6px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--line);font-size:12px;font-weight:700}
.pill.ok{background:rgba(52,211,153,.15);color:var(--green)}.pill.bad{background:rgba(248,113,113,.15);color:var(--red)}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat b{font-family:Sora;font-size:26px;display:block}.stat span{color:var(--muted);font-size:12px}
/* timetable grid */
.tt-wrap{overflow:auto}
table.tt{border-collapse:separate;border-spacing:4px;width:100%;min-width:720px}
table.tt th{font-size:11px;color:var(--muted);font-weight:700;padding:4px}
table.tt th.day{text-align:left;font-family:Sora;font-size:13px;color:var(--text);width:90px}
table.tt th small{display:block;font-weight:400}
table.tt td{height:62px;background:var(--panel2);border-radius:10px;padding:0;position:relative;vertical-align:top}
table.tt td.off{background:repeating-linear-gradient(45deg,#2a1620,#2a1620 6px,#1d1220 6px,#1d1220 12px)}
table.tt td.drop-ok{outline:2px dashed var(--green)}
table.tt td.drop-bad{outline:2px dashed var(--red)}
table.tt td.brk{width:10px;background:transparent}
.cc{position:absolute;inset:0;border-radius:10px;padding:6px 8px;color:#0b1220;font-size:12px;line-height:1.25;cursor:grab;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cc b{font-family:Sora;font-size:13px;display:block}
.cc .lk{position:absolute;right:5px;top:3px;font-size:11px}
.cc.dbl{right:-4px}
.unplaced{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.unplaced .chip{padding:5px 9px;border-radius:8px;color:#0b1220;font-size:12px;font-weight:700;cursor:grab}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,6,14,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.box h3{margin-bottom:14px}
.box .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.offgrid{border-collapse:separate;border-spacing:3px}
.offgrid td{width:34px;height:28px;background:var(--panel2);border-radius:6px;cursor:pointer;text-align:center;font-size:11px}
.offgrid td.x{background:var(--red);color:#111}
.offgrid th{font-size:11px;color:var(--muted);padding:0 4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;transition:.3s;z-index:60;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--pink),var(--cyan));transition:width .2s}
.hero{background:radial-gradient(circle at 85% 20%,rgba(34,211,238,.18),transparent 45%),radial-gradient(circle at 10% 90%,rgba(245,158,11,.18),transparent 45%),var(--panel)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.step:hover{border-color:var(--amber)}
.step b{font-family:Sora}.step p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.menu-btn{display:none}
.print-only{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:-260px;width:240px;z-index:40;transition:.25s}
  aside.open{left:0}
  .menu-btn{display:inline-block;margin-bottom:12px}
  main{padding:18px}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000}
  aside,.no-print,.menu-btn,.toast{display:none!important}
  .app{display:block}main{padding:0}
  .card{border:0;padding:0;background:#fff}
  .print-only{display:block}
  .print-page{page-break-after:always;padding-top:4px}
  .print-page:last-child{page-break-after:auto}
  .print-page h2{font-size:18px;margin-bottom:2px;color:#000}
  .print-page .muted{color:#444}
  table.tt{min-width:0;border-spacing:2px}
  table.tt th,table.tt th.day{color:#000}
  table.tt td{background:#f2f2f2;height:54px;border:1px solid #ccc}
  table.tt td.brk{border:0;background:#fff}
  .cc{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .screen-only{display:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><div class="logo"><i></i><i></i><i></i><i></i></div><div><b>Digital Timetable</b><small>Penjana Jadual Waktu</small></div></div>
    <button class="nav" data-v="home"><span class="n">⌂</span>Utama</button>
    <button class="nav" data-v="settings"><span class="n">1</span>Maklumat Asas</button>
    <button class="nav" data-v="subjects"><span class="n">2</span>Subjek</button>
    <button class="nav" data-v="classes"><span class="n">3</span>Kelas</button>
    <button class="nav" data-v="rooms"><span class="n">4</span>Bilik</button>
    <button class="nav" data-v="teachers"><span class="n">5</span>Guru</button>
    <button class="nav" data-v="lessons"><span class="n">6</span>Pelajaran</button>
    <button class="nav" data-v="generate"><span class="n">7</span>Semak &amp; Jana</button>
    <button class="nav" data-v="view"><span class="n">▦</span>Jadual Waktu</button>
    <div class="foot">Data disimpan dalam peranti anda.<br>Berfungsi tanpa internet.</div>
  </aside>
  <main>
    <button class="btn menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰ Menu</button>
    <div id="view"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
'use strict';
/* =========================================================
   DATA
   ========================================================= */
const KEY = 'digital-timetable-data-v1';
const PALETTE = ['#f59e0b','#22d3ee','#34d399','#f472b6','#a3e635','#fb923c','#60a5fa','#facc15','#f87171','#2dd4bf','#c084fc','#fda4af','#93c5fd','#86efac','#fcd34d','#67e8f9'];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

function defaultTimes(n, start = '07:30', dur = 30) {
  const out = []; let [h, m] = start.split(':').map(Number); let t = h * 60 + m;
  const f = x => String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
  for (let i = 0; i < n; i++) { out.push({ s: f(t), e: f(t + dur) }); t += dur; }
  return out;
}
function blank() {
  return {
    settings: { school: '', year: String(new Date().getFullYear()), days: ['Isnin','Selasa','Rabu','Khamis','Jumaat'], periods: 10, times: defaultTimes(10), breaks: [] },
    subjects: [], classes: [], rooms: [], teachers: [], lessons: [], cards: []
  };
}
function demo() {
  const d = blank();
  d.settings.school = 'SMK Contoh Digital'; d.settings.breaks = [4];
  const subj = [['Bahasa Melayu','BM'],['Bahasa Inggeris','BI'],['Matematik','MT'],['Sains','SN'],['Sejarah','SJ'],['Pendidikan Islam','PI'],['Geografi','GE'],['Pendidikan Jasmani','PJ'],['Reka Bentuk & Teknologi','RBT'],['Pendidikan Seni','PSV']];
  subj.forEach((s, i) => d.subjects.push({ id: uid(), name: s[0], short: s[1], color: PALETTE[i % PALETTE.length] }));
  ['1 Amanah','1 Bestari','2 Amanah','2 Bestari'].forEach(n => d.classes.push({ id: uid(), name: n }));
  [['Makmal Sains'],['Gelanggang'],['Bengkel RBT']].forEach(r => d.rooms.push({ id: uid(), name: r[0] }));
  const tn = [['Pn. Aisyah','AIS'],['En. Badrul','BAD'],['Cik Chong','CHG'],['Pn. Devi','DEV'],['En. Faizal','FAI'],['Ust. Hakim','HAK'],['Pn. Intan','INT'],['En. Jamal','JAM']];
  tn.forEach((t, i) => d.teachers.push({ id: uid(), name: t[0], short: t[1], color: PALETTE[(i + 5) % PALETTE.length], off: {}, maxDay: 0 }));
  const S = k => d.subjects.find(s => s.short === k).id, T = k => d.teachers.find(t => t.short === k).id, R = k => d.rooms.find(r => r.name === k).id;
  const plan = [['BM','AIS',6,1,''],['BI','CHG',5,1,''],['MT','BAD',5,1,''],['SN','DEV',4,2,'Makmal Sains'],['SJ','INT',3,1,''],['PI','HAK',4,1,''],['GE','INT',2,1,''],['PJ','FAI',2,2,'Gelanggang'],['RBT','JAM',2,2,'Bengkel RBT'],['PSV','JAM',2,1,'']];
  d.classes.forEach((c, ci) => plan.forEach(p => {
    let t = T(p[1]);
    if (ci >= 2 && p[0] === 'BM') t = T('CHG') === t ? t : T('AIS');
    d.lessons.push({ id: uid(), classId: c.id, subjectId: S(p[0]), teacherId: t, roomId: p[4] ? R(p[4]) : '', perWeek: p[2], len: p[3] });
  }));
  d.teachers.find(t => t.short === 'FAI').off = { '4-7': true, '4-8': true, '4-9': true };
  return d;
}
let DB;
try { DB = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { DB = null; }
if (!DB) DB = blank();
function normalize() {
  const b = blank();
  for (const k of Object.keys(b)) if (DB[k] === undefined) DB[k] = b[k];
  for (const k of Object.keys(b.settings)) if (DB.settings[k] === undefined) DB.settings[k] = b.settings[k];
  const P = DB.settings.periods;
  while (DB.settings.times.length < P) { const l = DB.settings.times[DB.settings.times.length - 1]; DB.settings.times.push(defaultTimes(1, l ? l.e : '07:30')[0]); }
  DB.settings.times.length = P;
  DB.teachers.forEach(t => { t.off = t.off || {}; t.maxDay = +t.maxDay || 0; });
  DB.lessons.forEach(l => { l.perWeek = Math.max(1, +l.perWeek || 1); l.len = Math.max(1, +l.len || 1); });
  // remove cards referring to missing lessons or invalid positions
  const ids = new Set(DB.lessons.map(l => l.id));
  DB.cards = (DB.cards || []).filter(c => ids.has(c.lessonId) && c.day < DB.settings.days.length && c.period + c.len <= P);
}
normalize();
function save() { localStorage.setItem(KEY, JSON.stringify(DB)); }

const byId = (arr, id) => arr.find(x => x.id === id);
const subj = id => byId(DB.subjects, id) || { name: '?', short: '?', color: '#888' };
const teach = id => byId(DB.teachers, id) || { name: '?', short: '?', color: '#888', off: {} };
const klass = id => byId(DB.classes, id) || { name: '?' };
const room = id => byId(DB.rooms, id);

/* =========================================================
   UI HELPERS
   ========================================================= */
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function openModal(html) { $('#mbox').innerHTML = html; $('#modal').classList.add('show'); const f = $('#mbox input,#mbox select'); if (f) f.focus(); }
function closeModal() { $('#modal').classList.remove('show'); }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
const opts = (arr, sel, label = x => x.name, empty) => (empty !== undefined ? `<option value="">${esc(empty)}</option>` : '') + arr.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(label(x))}</option>`).join('');
function lessonUnits(l) { return l.perWeek; }
function contrast(hex) { const h = hex.replace('#', ''); const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16); return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? '#0b1220' : '#ffffff'; }

let current = 'home';
const viewState = { type: 'class', id: '' };
function go(v) {
  current = v;
  document.querySelectorAll('.nav').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#side').classList.remove('open');
  render(); window.scrollTo(0, 0);
}
document.querySelectorAll('.nav').forEach(b => b.onclick = () => go(b.dataset.v));
function render() { $('#view').innerHTML = (VIEWS[current] || VIEWS.home)(); if (AFTER[current]) AFTER[current](); }
const head = (t, p, right = '') => `<div class="head"><div><h2>${t}</h2><p>${p}</p></div><div class="row no-print">${right}</div></div>`;
const nextBtn = (v, txt) => `<div class="row no-print" style="justify-content:flex-end"><button class="btn pri" onclick="go('${v}')">${txt} →</button></div>`;

/* =========================================================
   VIEWS
   ========================================================= */
const AFTER = {};
const VIEWS = {
  home() {
    const totalUnits = DB.lessons.reduce((a, l) => a + l.perWeek, 0);
    const placed = DB.cards.reduce((a, c) => a + c.len, 0);
    return head('Selamat datang 👋', esc(DB.settings.school || 'Bina jadual waktu sekolah anda dalam beberapa langkah.')) +
    `<div class="card hero"><h3 style="font-size:22px">Jadual waktu guru — dijana automatik.</h3>
      <p class="muted">Ikut langkah seperti aSc TimeTables: isi maklumat asas, subjek, kelas, bilik, guru dan pelajaran, kemudian tekan <b>Jana</b>.</p>
      <div class="steps">
        ${[['settings','1. Maklumat Asas','Nama sekolah, hari, waktu'],['subjects','2. Subjek','Senarai mata pelajaran'],['classes','3. Kelas','Senarai kelas'],['rooms','4. Bilik','Makmal, gelanggang (pilihan)'],['teachers','5. Guru','Warna, masa tidak hadir'],['lessons','6. Pelajaran','Siapa ajar apa, berapa waktu'],['generate','7. Semak & Jana','Jana jadual automatik'],['view','Jadual Waktu','Lihat, ubah & cetak']].map(s => `<div class="step" onclick="go('${s[0]}')"><b>${s[1]}</b><p>${s[2]}</p></div>`).join('')}
      </div></div>
    <div class="stats">
      <div class="stat"><b>${DB.subjects.length}</b><span>Subjek</span></div>
      <div class="stat"><b>${DB.classes.length}</b><span>Kelas</span></div>
      <div class="stat"><b>${DB.teachers.length}</b><span>Guru</span></div>
      <div class="stat"><b>${DB.lessons.length}</b><span>Pelajaran</span></div>
      <div class="stat"><b>${placed}/${totalUnits}</b><span>Waktu disusun</span></div>
    </div>
    <div class="card"><h3>Fail</h3><p class="muted">Simpan salinan data atau mulakan dengan contoh.</p>
      <div class="row">
        <button class="btn pri" onclick="loadDemo()">Muat data contoh</button>
        <button class="btn" onclick="exportJSON()">Eksport (.json)</button>
        <button class="btn" onclick="$('#fileIn').click()">Import (.json)</button>
        <button class="btn danger" onclick="newFile()">Fail baharu (kosong)</button>
        <button class="btn screen-only" id="installBtn" style="display:none" onclick="doInstall()">⬇ Pasang aplikasi</button>
      </div></div>`;
  },

  settings() {
    const s = DB.settings;
    const allDays = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
    return head('Maklumat Asas', 'Nama sekolah, hari persekolahan, bilangan waktu sehari dan masa setiap waktu.') +
    `<div class="card"><div class="grid2">
      <div><label>Nama sekolah</label><input id="s_school" value="${esc(s.school)}" placeholder="cth: SMK Taman Ilmu"></div>
      <div><label>Tahun / sesi</label><input id="s_year" value="${esc(s.year)}"></div>
      <div><label>Bilangan waktu sehari</label><input id="s_periods" type="number" min="1" max="16" value="${s.periods}"></div>
      <div><label>Mula waktu pertama</label><input id="s_start" type="time" value="${esc(s.times[0] ? s.times[0].s : '07:30')}"></div>
      <div><label>Tempoh satu waktu (minit)</label><input id="s_dur" type="number" min="5" max="120" value="30"></div>
    </div>
    <div style="margin-top:14px"><label>Hari persekolahan</label><div class="row">

function saveSettings() {
  const s = DB.settings;
  s.school = $('#s_school').value.trim(); s.year = $('#s_year').value.trim();
  const order = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
  const days = [...document.querySelectorAll('.s_day:checked')].map(x => x.value).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  if (!days.length) return toast('Pilih sekurang-kurangnya satu hari.');
  const oldDays = s.days.slice();
  const P = Math.min(16, Math.max(1, parseInt($('#s_periods').value) || 1));
  document.querySelectorAll('.t_s').forEach(i => { if (s.times[i.dataset.i]) s.times[i.dataset.i].s = i.value; });
  document.querySelectorAll('.t_e').forEach(i => { if (s.times[i.dataset.i]) s.times[i.dataset.i].e = i.value; });
  s.breaks = [...document.querySelectorAll('.t_b:checked')].map(i => +i.dataset.i).filter(i => i < P - 1);
  // remap day indexes in cards and teacher off-times when days change
  if (days.join() !== oldDays.join()) {
    const map = oldDays.map(d => days.indexOf(d));
    DB.cards = DB.cards.map(c => ({ ...c, day: map[c.day] })).filter(c => c.day >= 0);
    DB.teachers.forEach(t => { const n = {}; for (const k in t.off) { const [d, p] = k.split('-').map(Number); if (map[d] >= 0) n[map[d] + '-' + p] = true; } t.off = n; });
  }
  s.days = days; s.periods = P;
  normalize(); save(); render(); toast('Maklumat asas disimpan.');
}
function autoTimes() {
  const P = Math.min(16, Math.max(1, parseInt($('#s_periods').value) || 1));
  const dur = Math.max(5, parseInt($('#s_dur').value) || 30);
  DB.settings.periods = P; DB.settings.times = defaultTimes(P, $('#s_start').value || '07:30', dur);
  DB.settings.school = $('#s_school').value.trim(); DB.settings.year = $('#s_year').value.trim();
  normalize(); save(); render(); toast('Masa dikira semula.');
}
function removeItem(kind, id) {
  const labels = { subjects: 'subjek', classes: 'kelas', rooms: 'bilik', teachers: 'guru', lessons: 'pelajaran' };
  const field = { subjects: 'subjectId', classes: 'classId', teachers: 'teacherId' }[kind];
  const affected = field ? DB.lessons.filter(l => l[field] === id).length : 0;
  if (!confirm(`Padam ${labels[kind]} ini?${affected ? `\n${affected} pelajaran berkaitan juga akan dipadam.` : ''}`)) return;
  DB[kind] = DB[kind].filter(x => x.id !== id);
  if (field) DB.lessons = DB.lessons.filter(l => l[field] !== id);
  if (kind === 'rooms') DB.lessons.forEach(l => { if (l.roomId === id) l.roomId = ''; });
  normalize(); save(); render();
}

function editOff(id) {
  const t = byId(DB.teachers, id); const S = DB.settings; const off = { ...t.off };
  const draw = () => `<table class="offgrid"><tr><th></th>${S.times.map((_, p) => `<th>${p + 1}</th>`).join('')}</tr>${S.days.map((d, di) => `<tr><th style="text-align:left">${d.slice(0, 3)}</th>${S.times.map((_, p) => `<td data-k="${di}-${p}" class="${off[di + '-' + p] ? 'x' : ''}">${off[di + '-' + p] ? '✖' : ''}</td>`).join('')}</tr>`).join('')}</table>`;
  openModal(`<h3>Masa tidak hadir — ${esc(t.name)}</h3><p class="muted">Klik slot di mana guru <b>tidak boleh</b> mengajar. Klik nama hari untuk togol sehari penuh.</p><div class="tt-wrap" id="offw">${draw()}</div>
    <div class="actions"><button class="btn" id="offClr">Kosongkan</button><button class="btn" onclick="closeModal()">Batal</button><button class="btn pri" id="offSave">Simpan</button></div>`);
  const bind = () => {
    document.querySelectorAll('#offw td').forEach(td => td.onclick = () => { const k = td.dataset.k; if (off[k]) delete off[k]; else off[k] = true; $('#offw').innerHTML = draw(); bind(); });
    document.querySelectorAll('#offw tr th:first-child').forEach((th, i) => { if (i === 0) return; th.style.cursor = 'pointer'; th.onclick = () => { const d = i - 1; const all = S.times.every((_, p) => off[d + '-' + p]); S.times.forEach((_, p) => { if (all) delete off[d + '-' + p]; else off[d + '-' + p] = true; }); $('#offw').innerHTML = draw(); bind(); }; });
  };
  bind();
  $('#offClr').onclick = () => { for (const k in off) delete off[k]; $('#offw').innerHTML = draw(); bind(); };
  $('#offSave').onclick = () => { t.off = off; save(); closeModal(); render(); toast('Masa tidak hadir disimpan.'); };
}

function copyLessons() {
  if (DB.classes.length < 2) return toast('Perlukan sekurang-kurangnya 2 kelas.');
  modalForm('Salin pelajaran ke kelas lain', `<div class="grid2"><div><label>Dari kelas</label><select id="f_from">${opts(DB.classes)}</select></div><div><label>Ke kelas</label><select id="f_to" multiple size="5">${opts(DB.classes)}</select></div></div><p class="muted" style="font-size:12px">Subjek, guru, bilik dan bilangan waktu akan disalin.</p>`, () => {
    const from = $('#f_from').value, to = [...$('#f_to').selectedOptions].map(x => x.value).filter(x => x !== from);
    if (!to.length) { toast('Pilih kelas destinasi.'); return false; }
    const src = DB.lessons.filter(l => l.classId === from);
    to.forEach(c => src.forEach(l => DB.lessons.push({ ...l, id: uid(), classId: c })));
    toast(`${src.length * to.length} pelajaran disalin.`);
  });
}

/* =========================================================
   CHECK DATA
   ========================================================= */
function checkData() {
  const S = DB.settings, D = S.days.length, P = S.periods, cap = D * P, out = [];
  if (!DB.classes.length) out.push({ lvl: 'err', msg: 'Tiada kelas.' });
  if (!DB.teachers.length) out.push({ lvl: 'err', msg: 'Tiada guru.' });
  if (!DB.lessons.length) out.push({ lvl: 'err', msg: 'Tiada pelajaran.' });
  DB.classes.forEach(c => { const u = DB.lessons.filter(l => l.classId === c.id).reduce((a, l) => a + l.perWeek, 0); if (u > cap) out.push({ lvl: 'err', msg: `Kelas <b>${esc(c.name)}</b> mempunyai ${u} waktu tetapi hanya ${cap} slot seminggu.` }); });
  DB.teachers.forEach(t => {
    const u = DB.lessons.filter(l => l.teacherId === t.id).reduce((a, l) => a + l.perWeek, 0);
    let avail = cap - Object.keys(t.off).filter(k => +k.split('-')[0] < D && +k.split('-')[1] < P).length;
    if (t.maxDay) avail = Math.min(avail, t.maxDay * D);
    if (u > avail) out.push({ lvl: 'err', msg: `Guru <b>${esc(t.name)}</b> perlu mengajar ${u} waktu tetapi hanya ${avail} slot tersedia.` });
    else if (u > avail * 0.9 && u > 0) out.push({ lvl: 'warn', msg: `Guru <b>${esc(t.name)}</b> hampir penuh (${u}/${avail}). Penjanaan mungkin sukar.` });
  });
  DB.rooms.forEach(r => { const u = DB.lessons.filter(l => l.roomId === r.id).reduce((a, l) => a + l.perWeek, 0); if (u > cap) out.push({ lvl: 'err', msg: `Bilik <b>${esc(r.name)}</b> diperlukan ${u} waktu, melebihi ${cap} slot.` }); });
  DB.lessons.forEach(l => { if (l.len > P) out.push({ lvl: 'err', msg: `Pelajaran ${esc(subj(l.subjectId).name)} (${esc(klass(l.classId).name)}) lebih panjang dari sehari.` }); });
  const noLesson = DB.classes.filter(c => !DB.lessons.some(l => l.classId === c.id));
  if (noLesson.length) out.push({ lvl: 'warn', msg: `Kelas tanpa pelajaran: ${noLesson.map(c => esc(c.name)).join(', ')}` });
  return out;
}

/* =========================================================
   GENERATOR
   ========================================================= */
function splitUnits(l) {
  const out = []; let rem = l.perWeek;
  while (rem >= l.len) { out.push(l.len); rem -= l.len; }
  if (rem > 0) out.push(rem);
  return out;
}
function buildCtx(consecMax) {
  const S = DB.settings, D = S.days.length, P = S.periods;
  const lmap = {}; DB.lessons.forEach(l => lmap[l.id] = l);
  const tMap = {}; DB.teachers.forEach(t => tMap[t.id] = t);
  const sessions = {}; DB.lessons.forEach(l => sessions[l.id] = splitUnits(l).length);
  return { D, P, lmap, tMap, sessions, consecMax, breaks: new Set(S.breaks) };
}
function emptyOcc(ctx) {
  return { cls: {}, tch: {}, room: {}, perDay: {}, tDay: {} };
}
const key3 = (d, p) => d * 100 + p;
function occAdd(occ, ctx, card, sign) {
  const l = ctx.lmap[card.lessonId];
  for (let k = 0; k < card.len; k++) {
    const s = key3(card.day, card.period + k);
    const set = (o, id) => { o[id] = o[id] || {}; if (sign > 0) o[id][s] = card; else delete o[id][s]; };
    set(occ.cls, l.classId); set(occ.tch, l.teacherId); if (l.roomId) set(occ.room, l.roomId);
  }
  const pd = l.id + ':' + card.day; occ.perDay[pd] = (occ.perDay[pd] || 0) + sign;
  const td = l.teacherId + ':' + card.day; occ.tDay[td] = (occ.tDay[td] || 0) + sign * card.len;
}
// returns list of conflicting cards (hard), or null if structurally impossible
function conflicts(occ, ctx, lessonId, len, d, p, ignore) {
  const l = ctx.lmap[lessonId], t = ctx.tMap[l.teacherId];
  if (p + len > ctx.P) return null;
  for (let k = 0; k < len; k++) {
    if (t && t.off[d + '-' + (p + k)]) return null;
  }
  const found = new Set();
  for (let k = 0; k < len; k++) {
    const s = key3(d, p + k);
    const a = occ.cls[l.classId]?.[s], b = occ.tch[l.teacherId]?.[s], c = l.roomId ? occ.room[l.roomId]?.[s] : null;
    [a, b, c].forEach(x => { if (x && x !== ignore) found.add(x); });
  }
  return [...found];
}
function softOk(occ, ctx, lessonId, len, d, p, ignore) {
  const l = ctx.lmap[lessonId], t = ctx.tMap[l.teacherId];
  const ign = ignore && ignore.lessonId === lessonId && ignore.day === d ? 1 : 0;
  const limit = Math.ceil(ctx.sessions[l.id] / ctx.D);
  if ((occ.perDay[l.id + ':' + d] || 0) - ign >= limit) return false;
  if (t && t.maxDay) { const ignT = ignore && ctx.lmap[ignore.lessonId].teacherId === l.teacherId && ignore.day === d ? ignore.len : 0; if ((occ.tDay[l.teacherId + ':' + d] || 0) - ignT + len > t.maxDay) return false; }
  if (ctx.consecMax > 0) {
    const busy = q => q >= p && q < p + len ? true : (!!occ.tch[l.teacherId]?.[key3(d, q)] && occ.tch[l.teacherId][key3(d, q)] !== ignore);
    let run = 0, maxRun = 0;
    for (let q = 0; q < ctx.P; q++) { if (busy(q)) { run++; maxRun = Math.max(maxRun, run); } else run = 0; if (ctx.breaks.has(q)) run = 0; }
    if (maxRun > ctx.consecMax) return false;
  }
  return true;
}
function score(occ, ctx, lessonId, len, d, p) {
  const l = ctx.lmap[lessonId];
  let sc = Math.random() * 3;
  sc += (occ.tDay[l.teacherId + ':' + d] || 0) * 0.8;       // spread teacher load over days
  sc += p * 0.15;                                             // slightly prefer earlier periods
  // prefer adjacent to class's existing lessons (fewer gaps for class)
  const c = occ.cls[l.classId] || {};
  if (p > 0 && !c[key3(d, p - 1)]) sc += 0.6;
  const tt = occ.tch[l.teacherId] || {};
  if ((p > 0 && tt[key3(d, p - 1)]) || tt[key3(d, p + len)]) sc -= 0.4;
  return sc;
}
function attempt(ctx, lockedCards, units) {
  const occ = emptyOcc(ctx); const placed = [];
  lockedCards.forEach(c => { occAdd(occ, ctx, c, 1); placed.push(c); });
  // difficulty ordering with randomness
  const queue = units.map(u => ({ ...u, r: Math.random() })).sort((a, b) => (b.diff + b.r * 2) - (a.diff + a.r * 2));
  const unplaced = []; let budget = units.length * 25;
  const all = [];
  for (let d = 0; d < ctx.D; d++) for (let p = 0; p < ctx.P; p++) all.push([d, p]);
  while (queue.length) {
    const u = queue.shift();
    let best = null, bestSc = Infinity;
    for (const [d, p] of all) {
      const cf = conflicts(occ, ctx, u.lessonId, u.len, d, p);
      if (!cf || cf.length) continue;
      if (!softOk(occ, ctx, u.lessonId, u.len, d, p)) continue;
      const sc = score(occ, ctx, u.lessonId, u.len, d, p);
      if (sc < bestSc) { bestSc = sc; best = [d, p]; }
    }
    if (best) { const c = { lessonId: u.lessonId, day: best[0], period: best[1], len: u.len, locked: false }; occAdd(occ, ctx, c, 1); placed.push(c); continue; }
    // repair: evict up to 1-2 non-locked conflicting cards
    if (budget-- > 0) {
      let opts2 = [];
      for (const [d, p] of all) {
        const cf = conflicts(occ, ctx, u.lessonId, u.len, d, p);
        if (!cf || !cf.length || cf.length > 2 || cf.some(x => x.locked)) continue;
        cf.forEach(x => occAdd(occ, ctx, x, -1));
        const ok = softOk(occ, ctx, u.lessonId, u.len, d, p);
        cf.forEach(x => occAdd(occ, ctx, x, 1));
        if (ok) opts2.push([d, p, cf]);
      }
      if (opts2.length) {
        const [d, p, cf] = opts2[Math.floor(Math.random() * opts2.length)];
        cf.forEach(x => { occAdd(occ, ctx, x, -1); placed.splice(placed.indexOf(x), 1); queue.unshift({ lessonId: x.lessonId, len: x.len, diff: 0 }); });
        const c = { lessonId: u.lessonId, day: d, period: p, len: u.len, locked: false }; occAdd(occ, ctx, c, 1); placed.push(c);
        continue;
      }
    }
    unplaced.push(u);
  }
  return { placed, missing: unplaced.reduce((a, u) => a + u.len, 0) };
}
let generating = false;
function runGenerate() {
  if (generating) return;
  const secs = Math.max(2, parseInt($('#g_time').value) || 10);
  const consec = Math.max(0, parseInt($('#g_consec').value) || 0);
  const ctx = buildCtx(consec);
  const locked = DB.cards.filter(c => c.locked);
  // units still needed after locked cards
  const units = [];
  DB.lessons.forEach(l => {
    const lockedLen = locked.filter(c => c.lessonId === l.id).map(c => c.len);
    const parts = splitUnits(l);
    lockedLen.forEach(len => { const i = parts.indexOf(len); if (i >= 0) parts.splice(i, 1); else { let r = len; while (r > 0 && parts.length) { const x = parts.pop(); r -= x; } } });
    const t = ctx.tMap[l.teacherId];
    const tLoad = DB.lessons.filter(x => x.teacherId === l.teacherId).reduce((a, x) => a + x.perWeek, 0);
    const diff = tLoad / (ctx.D * ctx.P) * 10 + Object.keys(t?.off || {}).length * 0.2 + (l.roomId ? 3 : 0);
    parts.forEach(len => units.push({ lessonId: l.id, len, diff: diff + len * 2 }));
  });
  generating = true;
  const bar = $('#gbar'), msg = $('#gmsg'), btn = $('#genBtn');
  btn.disabled = true; btn.textContent = '⏳ Menjana...';
  const t0 = performance.now(); let best = null, tries = 0;
  const total = units.reduce((a, u) => a + u.len, 0);
  const step = () => {
    const sliceEnd = performance.now() + 120;
    while (performance.now() < sliceEnd) {
      const r = attempt(ctx, locked, units); tries++;
      if (!best || r.missing < best.missing) best = r;
      if (best.missing === 0) break;
    }
    const el = (performance.now() - t0) / 1000;
    bar.style.width = Math.min(100, best.missing === 0 ? 100 : el / secs * 100) + '%';
    msg.textContent = `Cubaan ${tries} · terbaik: ${total - best.missing}/${total} waktu disusun`;
    if (best.missing === 0 || el >= secs) {
      DB.cards = best.placed; save(); generating = false;
      btn.disabled = false; btn.textContent = '⚡ Jana Jadual';
      if (best.missing === 0) { msg.innerHTML = `<span style="color:var(--green)">✔ Berjaya! Semua ${total} waktu disusun dalam ${el.toFixed(1)} saat.</span>`; toast('Jadual berjaya dijana!'); setTimeout(() => go('view'), 700); }
      else { msg.innerHTML = `<span style="color:var(--amber)">⚠ ${best.missing} waktu tidak dapat disusun. Cuba tambah masa, kurangkan kekangan, atau susun secara manual di halaman Jadual Waktu.</span>`; }
      return;
    }
    setTimeout(step, 0);
  };
  setTimeout(step, 30);
}
function clearCards(all) {
  if (!confirm(all ? 'Kosongkan semua slot termasuk yang dikunci?' : 'Kosongkan semua slot yang tidak dikunci?')) return;
  DB.cards = all ? [] : DB.cards.filter(c => c.locked); save(); render(); toast('Jadual dikosongkan.');
}

/* =========================================================
   GRID RENDER + DRAG & DROP
   ========================================================= */
function nameOf(type, id) { const o = type === 'class' ? byId(DB.classes, id) : type === 'teacher' ? byId(DB.teachers, id) : byId(DB.rooms, id); return o ? (type === 'class' ? 'Kelas ' : type === 'teacher' ? 'Guru: ' : 'Bilik: ') + o.name : ''; }
function cardsFor(type, id) {
  return DB.cards.filter(c => { const l = byId(DB.lessons, c.lessonId); if (!l) return false; return type === 'class' ? l.classId === id : type === 'teacher' ? l.teacherId === id : l.roomId === id; });
}
function unplacedFor(type, id) {
  const out = [];
  DB.lessons.filter(l => type === 'class' ? l.classId === id : l.teacherId === id).forEach(l => {
    const parts = splitUnits(l); const have = DB.cards.filter(c => c.lessonId === l.id).map(c => c.len);
    have.forEach(len => { const i = parts.indexOf(len); if (i >= 0) parts.splice(i, 1); else { let r = len; while (r > 0 && parts.length) r -= parts.pop(); } });
    parts.forEach(len => out.push({ l, len }));
  });
  return out;
}
function gridHTML(type, id, interactive) {
  const S = DB.settings, cards = cardsFor(type, id);
  const at = {}; cards.forEach(c => at[c.day + '-' + c.period] = c);
  const covered = {}; cards.forEach(c => { for (let k = 1; k < c.len; k++) covered[c.day + '-' + (c.period + k)] = true; });
  const t = type === 'teacher' ? byId(DB.teachers, id) : null;
  let h = `<table class="tt"><tr><th></th>`;
  S.times.forEach((tm, p) => { h += `<th>${p + 1}<small>${tm.s}–${tm.e}</small></th>`; if (S.breaks.includes(p)) h += `<th class="brk"></th>`; });
  h += '</tr>';
  S.days.forEach((d, di) => {
    h += `<tr><th class="day">${esc(d)}</th>`;
    let spanEnd = -1;
    for (let p = 0; p < S.periods; p++) {
      const k = di + '-' + p;
      if (covered[k]) { if (S.breaks.includes(p) && p === spanEnd) h += `<td class="brk"></td>`; continue; }
      const c = at[k];
      // if a multi-period card spans a break column, colspan must include the break cells
      let span = 1; if (c) { spanEnd = p + c.len - 1; span = c.len; for (let q = p; q < p + c.len - 1; q++) if (S.breaks.includes(q)) span++; }
      const off = t && t.off[k];
      h += `<td ${span > 1 ? `colspan="${span}"` : ''} class="${off ? 'off' : ''}" data-d="${di}" data-p="${p}">`;
      if (c) {
        const l = byId(DB.lessons, c.lessonId), s = subj(l.subjectId), tc = teach(l.teacherId), r = room(l.roomId);
        const color = type === 'teacher' ? s.color : (type === 'class' ? s.color : tc.color);
        const line2 = type === 'class' ? tc.short : type === 'teacher' ? klass(l.classId).name : klass(l.classId).name + ' · ' + tc.short;
        const idx = DB.cards.indexOf(c);
        h += `<div class="cc" ${interactive ? `draggable="true" data-idx="${idx}"` : ''} style="background:${color};color:${contrast(color)}" title="${esc(s.name)} — ${esc(tc.name)}"><b>${esc(s.short)}</b>${esc(line2)}${r && type !== 'room' ? '<br>' + esc(r.name) : ''}${c.locked ? '<span class="lk">🔒</span>' : ''}</div>`;
      }
      h += '</td>';
      if (S.breaks.includes(p) && !(c && c.len > 1)) h += `<td class="brk"></td>`;
    }
    h += '</tr>';
  });
  return h + '</table>';
}
function liveOcc(ctx, ignore) { const occ = emptyOcc(ctx); DB.cards.forEach(c => { if (c !== ignore) occAdd(occ, ctx, c, 1); }); return occ; }
function canDrop(lessonId, len, d, p, ignore) {
  const ctx = buildCtx(0); const occ = liveOcc(ctx, ignore);
  const cf = conflicts(occ, ctx, lessonId, len, d, p);
  if (!cf) return { ok: false, why: 'Guru tidak hadir / melebihi hari.' };
  if (cf.length) { const x = cf[0], l = ctx.lmap[x.lessonId]; return { ok: false, why: `Bertindih dengan ${subj(l.subjectId).short} (${klass(l.classId).name}, ${teach(l.teacherId).short}).` }; }
  return { ok: true };
}
let drag = null;
function bindGrid() {
  document.querySelectorAll('.cc[data-idx], .chip[data-new]').forEach(el => {
    el.addEventListener('dragstart', e => {
      if (el.dataset.idx !== undefined) { const c = DB.cards[+el.dataset.idx]; drag = { card: c, lessonId: c.lessonId, len: c.len }; }
      else drag = { card: null, lessonId: el.dataset.new, len: +el.dataset.len };
      e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'x');
    });
    el.addEventListener('dragend', () => { drag = null; document.querySelectorAll('.drop-ok,.drop-bad').forEach(x => x.classList.remove('drop-ok', 'drop-bad')); });
  });
  document.querySelectorAll('.cc[data-idx]').forEach(el => el.addEventListener('click', () => cardMenu(DB.cards[+el.dataset.idx])));
  document.querySelectorAll('table.tt td[data-d]').forEach(td => {
    td.addEventListener('dragover', e => { if (!drag) return; e.preventDefault(); const r = canDrop(drag.lessonId, drag.len, +td.dataset.d, +td.dataset.p, drag.card); td.classList.toggle('drop-ok', r.ok); td.classList.toggle('drop-bad', !r.ok); });
    td.addEventListener('dragleave', () => td.classList.remove('drop-ok', 'drop-bad'));
    td.addEventListener('drop', e => {
      e.preventDefault(); if (!drag) return;
      const d = +td.dataset.d, p = +td.dataset.p; const r = canDrop(drag.lessonId, drag.len, d, p, drag.card);
      if (!r.ok) { toast('✖ ' + r.why); drag = null; render(); return; }
      if (drag.card) { drag.card.day = d; drag.card.period = p; drag.card.locked = true; }
      else DB.cards.push({ lessonId: drag.lessonId, day: d, period: p, len: drag.len, locked: true });
      drag = null; save(); render(); toast('Dialih & dikunci 🔒');
    });
  });
}
function cardMenu(c) {
  const l = byId(DB.lessons, c.lessonId), s = subj(l.subjectId);
  openModal(`<h3>${esc(s.name)}</h3><p class="muted">${esc(klass(l.classId).name)} · ${esc(teach(l.teacherId).name)}${room(l.roomId) ? ' · ' + esc(room(l.roomId).name) : ''}<br>${esc(DB.settings.days[c.day])}, waktu ${c.period + 1}${c.len > 1 ? '–' + (c.period + c.len) : ''}</p>
    <div class="actions"><button class="btn danger" id="cmDel">Buang dari jadual</button><button class="btn" id="cmLock">${c.locked ? '🔓 Buka kunci' : '🔒 Kunci'}</button><button class="btn" onclick="closeModal()">Tutup</button></div>`);
  $('#cmDel').onclick = () => { DB.cards.splice(DB.cards.indexOf(c), 1); save(); closeModal(); render(); };
  $('#cmLock').onclick = () => { c.locked = !c.locked; save(); closeModal(); render(); };
}
function printAll() {
  const list = viewState.type === 'class' ? DB.classes : viewState.type === 'teacher' ? DB.teachers : DB.rooms;
  const S = DB.settings;
  $('#printArea').classList.add('screen-only');
  $('#printAll').innerHTML = list.map(x => `<div class="print-page"><h2>${esc(nameOf(viewState.type, x.id))}</h2><div class="muted" style="margin-bottom:6px">${esc(S.school)} · ${esc(S.year)}</div>${gridHTML(viewState.type, x.id, false)}</div>`).join('');
  const done = () => { $('#printArea').classList.remove('screen-only'); $('#printAll').innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 50);
}

/* =========================================================
   FILES
   ========================================================= */
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportJSON() { download(`digital-timetable-${(DB.settings.school || 'sekolah').replace(/\W+/g, '-')}.json`, JSON.stringify(DB, null, 2), 'application/json'); }
function exportCSV() {
  const S = DB.settings; const rows = [['Hari', 'Waktu', 'Masa', 'Kelas', 'Subjek', 'Guru', 'Bilik']];
  DB.cards.slice().sort((a, b) => a.day - b.day || a.period - b.period).forEach(c => {
    const l = byId(DB.lessons, c.lessonId);
    for (let k = 0; k < c.len; k++) rows.push([S.days[c.day], c.period + k + 1, `${S.times[c.period + k].s}-${S.times[c.period + k].e}`, klass(l.classId).name, subj(l.subjectId).name, teach(l.teacherId).name, room(l.roomId)?.name || '']);
  });
  download('jadual-waktu.csv', '\ufeff' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
}
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.settings || !Array.isArray(d.lessons)) throw 0; DB = d; normalize(); save(); go('home'); toast('Data diimport.'); } catch (x) { toast('Fail tidak sah.'); } };
  r.readAsText(f); e.target.value = '';
});
function loadDemo() { if (DB.lessons.length && !confirm('Ganti data semasa dengan data contoh?')) return; DB = demo(); normalize(); save(); render(); toast('Data contoh dimuatkan. Pergi ke "Semak & Jana".'); }
function newFile() { if (!confirm('Padam semua data dan mula fail baharu?')) return; DB = blank(); save(); render(); }

/* =========================================================
   PWA
   ========================================================= */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; const b = $('#installBtn'); if (b) b.style.display = ''; });
function doInstall() { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; const b = $('#installBtn'); if (b) b.style.display = 'none'; }); }
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

go('home');
</script>
